<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Tender Document Package Builder</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        :root {
            --bg: #f4f6f9;
            --card: #fff;
            --tx: #18212f;
            --mu: #5b6678;
            --bd: #d9dee7;
            --pri: #1d4ed8;
            --ok: #0f7b3f;
            --okb: #dcf5e6;
            --er: #b42318;
            --erb: #fde4e1;
            --wa: #8a5a00;
            --wab: #fff0cc;
            --gr: #4b5563;
            --grb: #e8ebf0;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media(prefers-color-scheme:dark) {
            :root:not([data-theme=light]) {
                --bg: #0f141c;
                --card: #18202c;
                --tx: #e8edf5;
                --mu: #9aa6b8;
                --bd: #2c3748;
                --pri: #6b9cff;
                --ok: #5dd28f;
                --okb: #12341f;
                --er: #ff8f85;
                --erb: #3d1815;
                --wa: #ffcb5c;
                --wab: #3a2c0a;
                --gr: #b5bfce;
                --grb: #263040
            }
        }

        :root[data-theme=dark] {
            --bg: #0f141c;
            --card: #18202c;
            --tx: #e8edf5;
            --mu: #9aa6b8;
            --bd: #2c3748;
            --pri: #6b9cff;
            --ok: #5dd28f;
            --okb: #12341f;
            --er: #ff8f85;
            --erb: #3d1815;
            --wa: #ffcb5c;
            --wab: #3a2c0a;
            --gr: #b5bfce;
            --grb: #263040
        }

        * {
            box-sizing: border-box
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font: 15px/1.45 system-ui, "Noto Sans Bengali", "Segoe UI", sans-serif
        }

        header {
            background: var(--card);
            border-bottom: 1px solid var(--bd);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: space-between
        }

        h1 {
            font-size: 19px;
            margin: 0
        }

        h2 {
            font-size: 16px;
            margin: 0 0 10px
        }

        main {
            max-width: 1180px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            gap: 16px
        }

        .card {
            background: var(--card);
            border: 1px solid var(--bd);
            border-radius: 8px;
            padding: 16px
        }

        .steps {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            font-size: 13px;
            color: var(--mu)
        }

        .steps span {
            background: var(--grb);
            padding: 3px 9px;
            border-radius: 99px
        }

        .lang {
            display: flex;
            border: 2px solid var(--pri);
            border-radius: 8px;
            overflow: hidden
        }

        .lang button {
            border: 0;
            background: none;
            color: var(--pri);
            padding: 7px 16px;
            font-weight: 600;
            cursor: pointer;
            font-size: 14px
        }

        .lang button.on {
            background: var(--pri);
            color: #fff
        }

        .btn {
            background: var(--pri);
            color: #fff;
            border: 0;
            border-radius: 6px;
            padding: 9px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer
        }

        .btn.sec {
            background: none;
            color: var(--pri);
            border: 1px solid var(--pri)
        }

        .btn:disabled {
            opacity: .45;
            cursor: not-allowed
        }

        .btn.sm {
            padding: 4px 10px;
            font-weight: 500
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 10px
        }

        .k {
            font-size: 12px;
            color: var(--mu)
        }

        .v {
            font-weight: 600
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px
        }

        th,
        td {
            text-align: left;
            padding: 8px 6px;
            border-bottom: 1px solid var(--bd);
            vertical-align: middle
        }

        th {
            font-size: 12px;
            color: var(--mu);
            text-transform: uppercase
        }

        select,
        input[type=date] {
            font: inherit;
            padding: 6px;
            border: 1px solid var(--bd);
            border-radius: 6px;
            background: var(--card);
            color: var(--tx);
            max-width: 100%
        }

        select:focus,
        input:focus,
        button:focus-visible {
            outline: 2px solid var(--pri);
            outline-offset: 1px
        }

        .b {
            display: inline-block;
            padding: 2px 9px;
            border-radius: 99px;
            font-size: 12px;
            font-weight: 700;
            white-space: nowrap
        }

        .OK {
            background: var(--okb);
            color: var(--ok)
        }

        .Missing,
        .Expired {
            background: var(--erb);
            color: var(--er)
        }

        .Needed {
            background: var(--wab);
            color: var(--wa)
        }

        .NP {
            background: var(--grb);
            color: var(--gr)
        }

        .msg {
            padding: 9px 12px;
            border-radius: 6px;
            margin-top: 8px;
            font-size: 14px
        }

        .msg.e {
            background: var(--erb);
            color: var(--er)
        }

        .msg.w {
            background: var(--wab);
            color: var(--wa)
        }

        .msg.o {
            background: var(--okb);
            color: var(--ok)
        }

        .empty {
            color: var(--mu);
            padding: 14px;
            text-align: center;
            border: 1px dashed var(--bd);
            border-radius: 6px
        }

        .drop {
            border: 2px dashed var(--bd);
            border-radius: 8px;
            padding: 16px;
            text-align: center
        }

        .tw {
            overflow-x: auto
        }

        ul {
            margin: 6px 0 0;
            padding-left: 20px
        }

        .row {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap
        }

        .exp-cell {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 175px;
        }

        .exp-box {
            padding: 6px 8px;
            border-radius: 6px;
            font-size: 12px;
            line-height: 1.35;
            margin-top: 2px;
        }

        .exp-detected {
            background: var(--okb);
            border: 1px solid var(--ok);
            color: var(--tx);
        }

        .exp-suggest {
            background: var(--wab);
            border: 1px solid var(--wa);
            color: var(--tx);
        }

        .exp-none {
            color: var(--mu);
            border: 1px dashed var(--bd);
            background: var(--grb);
        }
    </style>
</head>

<body>
    <header>
        <div>
            <h1 id="appTitle"></h1>
            <div class="steps" id="steps"></div>
        </div>
        <div class="lang" role="group" aria-label="Language"><button id="lEn"
                onclick="UI.setLang('en')">English</button><button id="lBn" onclick="UI.setLang('bn')">বাংলা</button>
        </div>
    </header>
    <main>
        <section class="card">
            <h2 id="h1s"></h2>
            <div class="row">
                <input type="file" id="reqIn" accept=".json,application/json" hidden>
                <button class="btn" id="reqBtn" onclick="reqIn.click()"></button>
                <span id="reqName" class="k"></span>
                <input type="file" id="logoIn" accept="image/png,image/jpeg,.png,.jpg,.jpeg" hidden>
                <button class="btn sec" id="logoBtn" onclick="logoIn.click()"></button>
                <span id="logoPrev" class="row" style="gap:6px;align-items:center"></span>
            </div>
            <div id="logoMsg"></div>
            <div id="reqMsg"></div>
            <div id="tender" class="grid" style="margin-top:12px"></div>
        </section>
        <section class="card">
            <h2 id="h2s"></h2>
            <div class="drop"><input type="file" id="pdfIn" accept="application/pdf,.pdf" multiple hidden><button
                    class="btn" id="pdfBtn" onclick="pdfIn.click()"></button>
                <div class="k" id="limits" style="margin-top:6px"></div>
            </div>
            <div id="upSum" style="margin-top:10px"></div>
            <div id="upMsg"></div>
            <div class="tw" id="files"></div>
        </section>
        <section class="card">
            <h2 id="h3s"></h2>
            <div id="stSum" class="row" style="margin-bottom:10px"></div>
            <div class="tw" id="reqs"></div>
        </section>
        <section class="card">
            <h2 id="h4s"></h2>
            <div id="why"></div>
            <div class="row" style="margin-top:10px"><button class="btn" id="gen"
                    onclick="App.generate()"></button><button class="btn sec" id="dl2" hidden
                    onclick="App.save()"></button><span id="genMsg"></span></div>
        </section>
    </main>

            async loadLogo(file) {
